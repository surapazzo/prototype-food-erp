apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-restaurant-os-canary
  namespace: foodtech-prod
  labels:
    app: aura-os
    track: canary
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aura-os
      track: canary
  template:
    metadata:
      labels:
        app: aura-os
        track: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: aura-engine
          image: ghcr.io/aura-hospitality/aura-restaurant-os:1.0.0-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: SDI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aura-vault-secrets
                  key: sdi-interscambio-token
            - name: STRIPE_APPLE_PAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: aura-vault-secrets
                  key: pci-tokenized-webhook-secret
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
